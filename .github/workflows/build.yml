name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "Nenhum .zip encontrado"; exit 1; fi
          echo "Usando: $ZIP"
          rm -rf proj work
          mkdir proj
          unzip -o "$ZIP" -d proj
          SM=$(find proj -type d -path '*/src/main' | head -n 1)
          if [ -z "$SM" ]; then
            echo "ERRO: nao achei src/main dentro do zip. Estrutura do zip:"
            find proj -maxdepth 4 | head -80
            exit 1
          fi
          mv "${SM%/src/main}" work
          echo "Estrutura do projeto:"
          find work -maxdepth 6 -name "*.java" | head -40

      - name: Corrigir Net.java
        working-directory: work
        run: |
          NET=$(find . -name Net.java | head -n 1)
          if [ -z "$NET" ]; then echo "Net.java nao existe, pulando"; exit 0; fi
          echo "Net.java em: $NET"
          NET="$NET" python3 - <<'PY'
          import os
          p=os.environ['NET']
          s=open(p).read()
          old='new ArrayList<>(b.readCollection(ArrayList::new, buf -> buf.readUtf(64)))'
          new='b.<String, ArrayList<String>>readCollection(ArrayList::new, buf -> buf.readUtf(64))'
          print('trecho encontrado' if old in s else 'AVISO: trecho nao encontrado')
          open(p,'w').write(s.replace(old,new))
          PY

      - name: Corrigir settings.gradle e build.gradle
        working-directory: work
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'ironorigins'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' }
          version = '0.1.0'
          group = 'dev.ironorigins'
          base { archivesName = 'ironorigins-1.20.1' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft { mappings channel: 'official', version: '1.20.1' }
          repositories {
              maven { url 'https://maven.minecraftforge.net/' }
              exclusiveContent {
                  forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
                  forRepositories(fg.repository)
                  filter { includeGroup 'maven.modrinth' }
              }
          }
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
              implementation fg.deobf('maven.modrinth:s4OWxYQQ:T1VAZjU6')
          }
          tasks.named('jar') { finalizedBy 'reobfJar' }
